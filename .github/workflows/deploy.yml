name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: strict build check
        run: mkdocs build --strict

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: record time before pip
        run: echo "T_START=$(date +%s)" >> $GITHUB_ENV

      - run: pip install -r requirements.txt

      - name: report pip time
        run: echo "pip install took $(($(date +%s) - $T_START))s"

      - run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - uses: actions/upload-artifact@v4
        with:
          name: site-helios
          path: site/
          retention-days: 1

  deploy-pages:
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-helios:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-helios
          path: site/

      - name: install sshpass
        run: sudo apt-get install -y sshpass

      - name: upload to helios
        env:
          HELIOS_PASS: ${{ secrets.HELIOS_PASSWORD }}
        run: |
          sshpass -e rsync -avz --delete -e "ssh -p 2222 -o StrictHostKeyChecking=no" \
            site/ s506807@helios.cs.ifmo.ru:~/public_html/ssg/
