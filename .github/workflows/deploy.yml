name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: strict build check
        run: mkdocs build --strict

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: cache timestamp before
        run: date +%s > /tmp/t_start

      - run: pip install -r requirements.txt

      - name: cache timestamp after pip
        run: echo "pip took $(($(date +%s) - $(cat /tmp/t_start)))s"

      - name: build for github pages
        run: |
          sed -i 's|site_url:.*|site_url: https://spoon221.github.io/SSG/|' mkdocs.yml
          mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: store site for helios
        uses: actions/upload-artifact@v4
        with:
          name: site-helios
          path: site/
          retention-days: 1

  deploy-pages:
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-helios:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-helios
          path: site/

      - name: upload to helios via scp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: helios.cs.ifmo.ru
          port: 2222
          username: s506807
          password: ${{ secrets.HELIOS_PASSWORD }}
          source: "site/*"
          target: ~/public_html/ssg/
          strip_components: 1
          rm: true
